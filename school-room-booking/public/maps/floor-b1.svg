<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Floor B1 - Ground Floor -->
  <defs>
    <style>
      .room { fill: #D1D5DB; stroke: #374151; stroke-width: 2; cursor: pointer; }
      .room:hover { fill: #9CA3AF; }
      .corridor { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #374151; pointer-events: none; }
    </style>
  </defs>

  <!-- Building outline -->
  <rect x="50" y="50" width="700" height="500" fill="none" stroke="#1F2937" stroke-width="3"/>

  <!-- Main corridor (L-shaped) -->
  <rect class="corridor" x="50" y="250" width="400" height="100"/>
  <rect class="corridor" x="350" y="250" width="100" height="300"/>

  <!-- Room B101 - Auditorium -->
  <rect class="room" data-room-id="room-b101" x="60" y="60" width="280" height="180"/>
  <text class="label" x="200" y="150" text-anchor="middle">B101</text>
  <text class="label" x="200" y="170" text-anchor="middle">Auditorium</text>

  <!-- Room B102 - Conference Room -->
  <rect class="room" data-room-id="room-b102" x="350" y="60" width="150" height="180"/>
  <text class="label" x="425" y="150" text-anchor="middle">B102</text>
  <text class="label" x="425" y="170" text-anchor="middle">Conference</text>

  <!-- Room B103 - Library -->
  <rect class="room" data-room-id="room-b103" x="510" y="60" width="230" height="280"/>
  <text class="label" x="625" y="200" text-anchor="middle">B103</text>
  <text class="label" x="625" y="220" text-anchor="middle">Library</text>

  <!-- Room B104 - Study Room -->
  <rect class="room" data-room-id="room-b104" x="60" y="360" width="140" height="180"/>
  <text class="label" x="130" y="450" text-anchor="middle">B104</text>
  <text class="label" x="130" y="470" text-anchor="middle">Study Room</text>

  <!-- Room B105 - Group Study -->
  <rect class="room" data-room-id="room-b105" x="210" y="360" width="130" height="180"/>
  <text class="label" x="275" y="450" text-anchor="middle">B105</text>
  <text class="label" x="275" y="470" text-anchor="middle">Group Study</text>

  <!-- Room B106 - Multimedia Room -->
  <rect class="room" data-room-id="room-b106" x="460" y="360" width="280" height="180"/>
  <text class="label" x="600" y="450" text-anchor="middle">B106</text>
  <text class="label" x="600" y="470" text-anchor="middle">Multimedia Room</text>
</svg>
